<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Mamá Virtuosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div id="boot" class="boot" role="status" aria-live="polite"><span class="spin big" aria-hidden="true"></span><span id="boot-t">Cargando panel…</span></div>

<main id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <img class="login-logo" src="/img/mama_virtuosa_logo.png" alt="Mamá Virtuosa" width="500" height="100">
    <h1 id="login-title">Panel de administración</h1>
    <p class="muted" id="login-sub"></p>
    <label class="fld" for="login-pw"><span>Contraseña</span></label>
    <div class="pw-wrap">
      <input type="password" id="login-pw" autocomplete="current-password" required>
      <button type="button" class="pw-eye" id="pw-eye" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <div class="form-err" id="login-err" role="alert"></div>
    <button class="btn" type="submit" id="login-btn"><span class="spin" hidden></span><span id="login-btn-t">Entrar</span></button>
  </form>
</main>

<div id="shell" hidden>
  <header class="top">
    <div class="brand"><img class="brand-logo" src="/img/mama_virtuosa_logo.png" alt="Mamá Virtuosa" width="500" height="100"><span class="badge">Panel</span></div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button data-tab="productos" class="on">Productos</button>
      <button data-tab="categorias">Categorías</button>
      <button data-tab="podcast">Podcast</button>
      <button data-tab="ajustes">Ajustes</button>
    </nav>
    <div class="top-actions">
      <span class="dirty" id="dirty" hidden>● Cambios sin guardar</span>
      <a class="btn ghost sm" href="/" target="_blank" rel="noopener">Ver tienda ↗</a>
      <button class="btn sm" id="save" disabled>Guardar cambios</button>
      <button class="link" id="logout">Salir</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
